<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخريطة الذهنية الذكية بالذكاء الاصطناعي</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Vis Network for Mind Maps -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
        }
        #mynetwork {
            width: 100%;
            height: 85vh;
            min-height: 600px;
            border: 2px dashed #cbd5e1;
            border-radius: 1rem;
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 1rem;
            display: none;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-5xl font-extrabold text-gray-800 mb-4">
                <i class="fa-solid fa-brain text-blue-500"></i> الخريطة الذهنية <span class="text-blue-600">الذكية</span>
            </h1>
            <p class="text-gray-600 text-lg">أدخل أي موضوع، وسيقوم الذكاء الاصطناعي بتوليد خريطة ذهنية مع صور توضيحية لتسهيل الحفظ والتذكر.</p>
        </div>

        <!-- Input Section -->
        <div class="flex flex-col md:flex-row gap-4 justify-center items-center mb-8">
            <input type="text" id="topicInput" placeholder="مثال: فوائد الرياضة، أسباب التلوث، تاريخ الأندلس..." 
                   class="w-full md:w-1/2 px-6 py-4 text-lg rounded-full border-2 border-gray-300 focus:outline-none focus:border-blue-500 shadow-sm transition-colors">
            <button onclick="generateMindMap()" 
                    class="w-full md:w-auto px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold rounded-full shadow-lg transition-transform transform hover:scale-105 flex items-center justify-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> إنشاء الخريطة
            </button>
        </div>

        <!-- Error/Message Box -->
        <div id="messageBox" class="hidden mb-4 p-4 rounded-lg text-center font-bold"></div>

        <!-- نافذة تعديل النص (Modal) -->
        <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center transition-opacity duration-300">
            <div class="bg-white rounded-2xl p-6 w-96 max-w-full mx-4 shadow-2xl transform transition-transform scale-100">
                <h3 class="text-xl font-bold mb-4 text-gray-800"><i class="fa-solid fa-pen text-blue-500 ml-2"></i>تعديل النص</h3>
                <input type="text" id="editNodeInput" placeholder="أدخل النص الجديد هنا..." 
                       class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 mb-6 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-colors text-lg">
                <div class="flex justify-end gap-3">
                    <button onclick="closeEditModal()" class="px-5 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors">إلغاء</button>
                    <button onclick="saveNodeEdit()" class="px-5 py-2.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-md transition-colors">حفظ التعديل</button>
                </div>
            </div>
        </div>

        <!-- Mind Map Container -->
        <div class="relative w-full">
            <div id="loadingOverlay" class="loading-overlay">
                <div class="spinner mb-4"></div>
                <p id="loadingText" class="text-xl font-bold text-gray-700">جاري بناء الهيكل الأساسي...</p>
                <p class="text-sm text-gray-500 mt-2">قد يستغرق توليد الصور بضع ثوانٍ إضافية</p>
            </div>
            
            <!-- زر إعادة التوسيط العائم -->
            <button id="centerBtn" onclick="centerMap()" class="hidden absolute bottom-4 left-4 z-10 bg-white p-3 rounded-full shadow-lg text-gray-700 hover:text-blue-600 hover:bg-gray-50 border border-gray-200 transition-all transform hover:scale-110" title="إعادة التوسيط (Fit)">
                <i class="fa-solid fa-expand"></i>
            </button>

            <div id="mynetwork"></div>
        </div>
        
        <!-- Instructions & Actions -->
        <div class="mt-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-wrap gap-4 text-sm text-gray-500">
                <span class="flex items-center gap-2"><i class="fa-solid fa-mouse-pointer"></i> يمكنك سحب العناصر وتحريكها</span>
                <span class="flex items-center gap-2"><i class="fa-solid fa-pen"></i> انقر مرتين على أي عنصر لتعديل النص</span>
                <span class="flex items-center gap-2"><i class="fa-solid fa-magnifying-glass-plus"></i> استخدم عجلة الفأرة للتكبير والتصغير</span>
            </div>
            <button id="downloadBtn" onclick="downloadMindMap()" class="hidden px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-full shadow-lg transition-transform transform hover:scale-105 flex items-center gap-2">
                <i class="fa-solid fa-download"></i> حفظ الخريطة كصورة
            </button>
        </div>
    </div>

    <script>
        // --- API Configuration ---
        // يتم استخدام هذا المتغير فارغاً هنا، لأن بيئة التشغيل ستقوم بتوفير المفتاح تلقائياً
        const apiKey = "AIzaSyCTecovTPt5crMJ3WyF6FWxbCOKQK52oWk"; 
        
        // --- State ---
        let network = null;
        let nodesDataset = null;
        let edgesDataset = null;
        let editingNodeId = null; // تتبع العقدة التي يتم تعديلها حالياً

        // --- Helper: Exponential Backoff Fetch ---
        async function fetchWithRetry(url, options, maxRetries = 5) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2; // Exponential backoff
                }
            }
        }

        // --- UI Functions ---
        function showMessage(msg, isError = false) {
            const box = document.getElementById('messageBox');
            box.textContent = msg;
            box.style.display = 'block';
            if (isError) {
                box.className = 'mb-4 p-4 rounded-lg text-center font-bold bg-red-100 text-red-700 border border-red-400';
            } else {
                box.className = 'mb-4 p-4 rounded-lg text-center font-bold bg-green-100 text-green-700 border border-green-400';
            }
            setTimeout(() => { box.style.display = 'none'; }, 5000);
        }

        function setLoading(isLoading, text = "جاري التحميل...") {
            document.getElementById('loadingOverlay').style.display = isLoading ? 'flex' : 'none';
            document.getElementById('loadingText').textContent = text;
        }

        // --- Network Rendering ---
        function initNetwork(nodes, edges) {
            nodesDataset = new vis.DataSet(nodes);
            edgesDataset = new vis.DataSet(edges);

            const container = document.getElementById('mynetwork');
            const data = { nodes: nodesDataset, edges: edgesDataset };
            const options = {
                nodes: {
                    borderWidth: 2,
                    borderWidthSelected: 4,
                    font: {
                        face: 'Cairo',
                        align: 'center',
                        bold: { color: '#343434', size: 16, vadjust: 0, mod: 'bold' }
                    },
                    shapeProperties: {
                        useBorderWithImage: true
                    }
                },
                edges: {
                    width: 2,
                    smooth: {
                        type: 'continuous',
                        roundness: 0.5
                    },
                    color: { inherit: 'to' }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: -3000,
                        centralGravity: 0.3,
                        springLength: 150,
                        springConstant: 0.04,
                        damping: 0.09
                    },
                    stabilization: { iterations: 150 }
                },
                layout: {
                    randomSeed: 2
                }
            };

            if (network) network.destroy();
            network = new vis.Network(container, data, options);

            // إيقاف الحركة التلقائية (الفيزياء) بمجرد استقرار الخريطة ليتمكن المستخدم من الترتيب اليدوي
            network.on("stabilizationIterationsDone", function () {
                network.setOptions({ physics: false });
            });

            // إضافة ميزة النقر المزدوج لتعديل النص
            network.on("doubleClick", function (params) {
                if (params.nodes.length > 0) {
                    editingNodeId = params.nodes[0];
                    const node = nodesDataset.get(editingNodeId);
                    const input = document.getElementById('editNodeInput');
                    
                    input.value = node.label || '';
                    document.getElementById('editModal').classList.remove('hidden');
                    
                    setTimeout(() => input.focus(), 100);
                }
            });
        }

        function getNodeStyle(level) {
            if (level === 0) {
                return { 
                    shape: 'box', 
                    color: { background: '#ef4444', border: '#b91c1c' }, // Red for center
                    font: { size: 24, color: '#ffffff', bold: true },
                    margin: 15,
                    borderWidth: 3
                };
            } else if (level === 1) {
                const colors = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                return { 
                    shape: 'box', 
                    color: { background: randomColor, border: '#1f2937' },
                    font: { size: 18, color: '#ffffff' },
                    margin: 10
                };
            } else {
                return { 
                    shape: 'box', 
                    color: { background: '#f3f4f6', border: '#9ca3af' },
                    font: { size: 14, color: '#1f2937' },
                    margin: 8
                };
            }
        }

        // --- AI API Calls ---

        // 1. Gemini - Text Structure
        async function fetchMindMapStructure(topic) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const promptText = `
                أريد إنشاء خريطة ذهنية مفصلة ومنظمة عن الموضوع التالي: "${topic}".
                يجب أن تكون العقدة المركزية (level 0) هي الموضوع الأساسي.
                استخرج 3 إلى 5 أقسام رئيسية (level 1).
                لكل قسم رئيسي، استخرج 2 إلى 3 تفاصيل فرعية (level 2).
                
                يجب أن تكون الأسماء (labels) قصيرة جداً ومناسبة لخريطة ذهنية.
            `;

            const payload = {
                contents: [{ parts: [{ text: promptText }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            nodes: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        id: { type: "INTEGER" },
                                        label: { type: "STRING" },
                                        level: { type: "INTEGER" }
                                    },
                                    required: ["id", "label", "level"]
                                }
                            },
                            edges: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        from: { type: "INTEGER" },
                                        to: { type: "INTEGER" }
                                    },
                                    required: ["from", "to"]
                                }
                            }
                        },
                        required: ["nodes", "edges"]
                    }
                }
            };

            const data = await fetchWithRetry(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!data || !data.candidates || data.candidates.length === 0) {
                console.error("API Response:", data);
                throw new Error("لم يقم الذكاء الاصطناعي بإرجاع أي بيانات (قد يكون الموضوع محظوراً أو هناك مشكلة في المفتاح).");
            }

            const textResponse = data.candidates[0].content?.parts?.[0]?.text;
            if (!textResponse) {
                throw new Error("تنسيق الاستجابة من الخادم غير صحيح.");
            }
            return JSON.parse(textResponse);
        }

        // 2. Imagen - Generate Images
        async function fetchImageForNode(label) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
            
            const promptText = `A very simple, minimal line art doodle icon illustrating "${label}", transparent or white background, vector style icon, flat colors, child-like drawing style, educational context.`;

            const payload = {
                instances: { prompt: promptText },
                parameters: { sampleCount: 1 }
            };

            const data = await fetchWithRetry(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (data && data.predictions && data.predictions.length > 0) {
                return `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
            }
            return null;
        }

        // --- Main Execution ---
        async function generateMindMap() {
            const topic = document.getElementById('topicInput').value.trim();
            if (!topic) {
                showMessage('الرجاء إدخال موضوع أولاً!', true);
                return;
            }

            try {
                // Step 1: Get Text Structure
                setLoading(true, "جاري التفكير وتصميم هيكل الخريطة...");
                const mapData = await fetchMindMapStructure(topic);
                
                // Format nodes for Vis.js
                const formattedNodes = mapData.nodes.map(node => {
                    const style = getNodeStyle(node.level);
                    return { ...node, ...style };
                });

                // Render initial text-only network
                initNetwork(formattedNodes, mapData.edges);

                // Step 2: Generate Images for Level 0 and Level 1
                setLoading(true, "جاري رسم الصور التوضيحية بالذكاء الاصطناعي...");
                
                const nodesToIllustrate = mapData.nodes.filter(n => n.level === 0 || n.level === 1);
                
                const imagePromises = nodesToIllustrate.map(async (node) => {
                    try {
                        const base64Image = await fetchImageForNode(node.label);
                        if (base64Image) {
                            nodesDataset.update({
                                id: node.id,
                                shape: 'circularImage',
                                image: base64Image,
                                size: node.level === 0 ? 55 : 40,
                                font: { 
                                    size: node.level === 0 ? 20 : 16, 
                                    color: '#1f2937', 
                                    background: 'rgba(255,255,255,0.8)' 
                                }
                            });
                        }
                    } catch (err) {
                        console.error(`Failed to generate image for ${node.label}`, err);
                    }
                });

                await Promise.allSettled(imagePromises);
                
                setLoading(false);
                showMessage('تم إنشاء الخريطة بنجاح!');
                document.getElementById('downloadBtn').classList.remove('hidden');
                document.getElementById('centerBtn').classList.remove('hidden');

            } catch (error) {
                console.error("Full error detail:", error);
                setLoading(false);
                showMessage(`عذراً، حدث خطأ: ${error.message || 'فشل الاتصال بالخادم.'}`, true);
            }
        }

        // Allow pressing Enter to generate
        document.getElementById('topicInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                generateMindMap();
            }
        });

        // --- Edit Modal Actions ---
        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            editingNodeId = null;
        }

        function saveNodeEdit() {
            if (editingNodeId !== null) {
                const newLabel = document.getElementById('editNodeInput').value;
                if (newLabel.trim() !== "") {
                    nodesDataset.update({ id: editingNodeId, label: newLabel.trim() });
                }
                closeEditModal();
            }
        }

        document.getElementById('editNodeInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                saveNodeEdit();
            }
        });

        // --- View Actions ---
        function centerMap() {
            if (network && nodesDataset) {
                const allNodes = nodesDataset.getIds();
                if (allNodes.length > 0) {
                    network.fit({
                        nodes: allNodes,
                        animation: {
                            duration: 800,
                            easingFunction: 'easeInOutQuad'
                        }
                    });
                }
            }
        }

        // --- Download Feature ---
        function downloadMindMap() {
            if (!network) {
                showMessage('لا توجد خريطة لتنزيلها!', true);
                return;
            }

            const container = document.getElementById('mynetwork');
            const currentScale = network.getScale();
            const currentPosition = network.getViewPosition();

            const exportSize = '4000px';
            network.setSize(exportSize, exportSize);
            network.fit({ animation: false });
            network.redraw(); 

            const networkCanvas = container.querySelector('canvas');
            const destCanvas = document.createElement('canvas');
            destCanvas.width = networkCanvas.width;
            destCanvas.height = networkCanvas.height;
            const ctx = destCanvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, destCanvas.width, destCanvas.height);
            ctx.drawImage(networkCanvas, 0, 0);

            network.setSize('100%', '85vh');
            network.moveTo({
                position: currentPosition,
                scale: currentScale,
                animation: false
            });
            network.redraw();

            const link = document.createElement('a');
            const topic = document.getElementById('topicInput').value.trim() || 'ذهنية';
            link.download = `خريطة_${topic.replace(/\s+/g, '_')}_عالية_الدقة.png`;
            link.href = destCanvas.toDataURL('image/png', 1.0); 
            
            link.click();
        }
    </script>
</body>
</html>
