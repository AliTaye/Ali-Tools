<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار سرعة الكتابة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        .word {
            margin-left: 0.5rem;
            margin-bottom: 0.5rem;
            display: inline-block;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .word.current {
            background-color: #e5e7eb;
            border-bottom: 2px solid #3b82f6;
        }
        .word.correct {
            color: #10b981; /* Green */
        }
        .word.incorrect {
            color: #ef4444; /* Red */
            text-decoration: line-through;
        }
        .input-error {
            background-color: #fee2e2;
            border-color: #ef4444 !important;
        }
        
        /* شريط التمرير المخفي للحفاظ على المظهر النظيف */
        #text-display::-webkit-scrollbar {
            width: 8px;
        }
        #text-display::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        #text-display::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl p-6 md:p-8">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">⚡ اختبار سرعة الكتابة</h1>
            <p class="text-gray-500">اختبر مهاراتك واعرف سرعتك في الطباعة باللغة العربية</p>
        </div>

        <!-- Controls (Difficulty) -->
        <div class="flex justify-center mb-6">
            <div class="bg-gray-100 p-1 rounded-lg inline-flex">
                <button onclick="setDifficulty('easy')" id="btn-easy" class="px-6 py-2 rounded-md font-bold text-gray-600 transition-colors bg-white shadow-sm">سهل</button>
                <button onclick="setDifficulty('medium')" id="btn-medium" class="px-6 py-2 rounded-md font-bold text-gray-600 transition-colors hover:text-gray-800">متوسط</button>
                <button onclick="setDifficulty('hard')" id="btn-hard" class="px-6 py-2 rounded-md font-bold text-gray-600 transition-colors hover:text-gray-800">صعب</button>
            </div>
        </div>

        <!-- Stats Panel -->
        <div class="grid grid-cols-3 gap-4 mb-6 text-center">
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <p class="text-blue-500 text-sm font-bold mb-1">الوقت المتبقي</p>
                <p class="text-3xl font-black text-blue-700" id="time-display">60<span class="text-lg font-medium">ث</span></p>
            </div>
            <div class="bg-green-50 p-4 rounded-xl border border-green-100">
                <p class="text-green-500 text-sm font-bold mb-1">السرعة (WPM)</p>
                <p class="text-3xl font-black text-green-700" id="wpm-display">0</p>
            </div>
            <div class="bg-purple-50 p-4 rounded-xl border border-purple-100">
                <p class="text-purple-500 text-sm font-bold mb-1">الدقة</p>
                <p class="text-3xl font-black text-purple-700" id="accuracy-display">100%</p>
            </div>
        </div>

        <!-- Text Display Area -->
        <div id="text-display" class="bg-gray-50 border-2 border-gray-200 rounded-xl p-5 text-xl leading-relaxed h-40 overflow-y-auto mb-6 text-gray-700 select-none">
            <!-- سيتم حقن الكلمات هنا بواسطة جافاسكربت -->
        </div>

        <!-- Input Area -->
        <div class="relative">
            <input type="text" id="type-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                class="w-full text-center text-2xl p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all outline-none"
                placeholder="ابدأ الكتابة هنا لبدء العداد...">
            
            <button onclick="resetGame()" class="absolute left-3 top-3 p-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-600 transition" title="إعادة المحاولة">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>

        <!-- Results Modal (Hidden by default) -->
        <div id="results-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
            <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center transform scale-100 transition-transform">
                <h2 class="text-3xl font-bold text-gray-800 mb-2">انتهى الوقت! 🎉</h2>
                <p class="text-gray-500 mb-6">إليك نتائج اختبارك:</p>
                
                <div class="space-y-4 mb-8">
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="text-gray-600 font-bold">السرعة:</span>
                        <span class="text-2xl font-black text-blue-600"><span id="final-wpm">0</span> WPM</span>
                    </div>
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="text-gray-600 font-bold">الدقة:</span>
                        <span class="text-2xl font-black text-purple-600" id="final-accuracy">100%</span>
                    </div>
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="text-gray-600 font-bold">الكلمات الصحيحة:</span>
                        <span class="text-xl font-bold text-green-500" id="final-correct">0</span>
                    </div>
                    <div class="flex justify-between items-center pb-2">
                        <span class="text-gray-600 font-bold">الكلمات الخاطئة:</span>
                        <span class="text-xl font-bold text-red-500" id="final-wrong">0</span>
                    </div>
                </div>

                <button onclick="closeModalAndReset()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-colors">
                    إعادة الاختبار
                </button>
            </div>
        </div>

    </div>

    <script>
        // قواعد البيانات للكلمات حسب المستويات
        const wordsDB = {
            easy: ["أسد", "بيت", "ولد", "بنت", "شمس", "قمر", "بحر", "سماء", "أرض", "جبل", "شجرة", "وردة", "سيارة", "قطار", "طائرة", "قلم", "كتاب", "دفتر", "باب", "ماء", "حليب", "خبز", "تفاح", "موز", "عين", "أذن", "يد", "قدم", "نار", "نور", "قلب", "حب", "فرح", "حزن", "يوم", "شهر", "سنة", "ليل", "نهار", "نوم"],
            
            medium: ["مكتبة", "مدرسة", "جامعة", "مستشفى", "حديقة", "رياضة", "سباحة", "قراءة", "كتابة", "ثقافة", "مجتمع", "اقتصاد", "سياسة", "تاريخ", "جغرافيا", "فيزياء", "كيمياء", "إنترنت", "حاسوب", "هاتف", "رسالة", "برنامج", "تطبيق", "كاميرا", "شاشة", "صناعة", "تجارة", "زراعة", "طبيعة", "سياحة", "رحلة", "صديق", "عائلة", "مستقبل", "نجاح"],
            
            hard: ["استراتيجية", "ديمقراطية", "ديكتاتورية", "بيروقراطية", "تكنولوجيا", "أيديولوجيا", "طمأنينة", "فسيفساء", "جيولوجيا", "ميتافيزيقا", "سيكولوجية", "سوسيولوجيا", "أنثروبولوجيا", "إمبراطورية", "جمهورية", "برلمان", "دستور", "استقلال", "تضحية", "مسؤولية", "شفافية", "مصداقية", "استدامة", "موسوعة", "خوارزمية", "استثنائي", "ديناميكية", "لوجستية", "بروتوكول", "دبلوماسية", "براغماتية", "طوباوية", "رأسمالية", "اشتراكية", "شمولية"]
        };

        // متغيرات اللعبة
        let currentDifficulty = 'easy';
        let wordsList = [];
        let currentWordIndex = 0;
        
        let timeLeft = 60;
        let timer = null;
        let isPlaying = false;
        
        let correctWords = 0;
        let wrongWords = 0;
        let totalKeystrokes = 0;
        let correctKeystrokes = 0;

        // عناصر DOM
        const displayArea = document.getElementById('text-display');
        const inputField = document.getElementById('type-input');
        const timeDisplay = document.getElementById('time-display');
        const wpmDisplay = document.getElementById('wpm-display');
        const accuracyDisplay = document.getElementById('accuracy-display');
        const modal = document.getElementById('results-modal');

        // تهيئة اللعبة عند التحميل
        window.onload = () => {
            initGame();
        };

        // اختيار مستوى الصعوبة
        function setDifficulty(level) {
            if(isPlaying) return; // منع التغيير أثناء اللعب
            
            currentDifficulty = level;
            
            // تحديث تصميم الأزرار
            ['easy', 'medium', 'hard'].forEach(diff => {
                const btn = document.getElementById(`btn-${diff}`);
                if(diff === level) {
                    btn.classList.add('bg-white', 'shadow-sm', 'text-gray-800');
                    btn.classList.remove('hover:text-gray-800');
                } else {
                    btn.classList.remove('bg-white', 'shadow-sm', 'text-gray-800');
                    btn.classList.add('hover:text-gray-800');
                }
            });

            resetGame();
        }

        // توليد نص عشوائي
        function generateWords() {
            const db = wordsDB[currentDifficulty];
            wordsList = [];
            // توليد 100 كلمة عشوائية
            for(let i=0; i<100; i++) {
                const randomIndex = Math.floor(Math.random() * db.length);
                wordsList.push(db[randomIndex]);
            }
        }

        // عرض الكلمات في الشاشة
        function renderWords() {
            displayArea.innerHTML = '';
            wordsList.forEach((word, index) => {
                const span = document.createElement('span');
                span.innerText = word;
                span.className = 'word';
                span.id = `word-${index}`;
                displayArea.appendChild(span);
            });
            // تحديد الكلمة الأولى
            document.getElementById(`word-0`).classList.add('current');
        }

        // بدء وإعادة تعيين اللعبة
        function initGame() {
            generateWords();
            renderWords();
            currentWordIndex = 0;
            timeLeft = 60;
            correctWords = 0;
            wrongWords = 0;
            totalKeystrokes = 0;
            correctKeystrokes = 0;
            isPlaying = false;
            
            timeDisplay.innerHTML = `60<span class="text-lg font-medium">ث</span>`;
            wpmDisplay.innerText = '0';
            accuracyDisplay.innerText = '100%';
            inputField.value = '';
            inputField.disabled = false;
            inputField.classList.remove('input-error');
            
            if(timer) clearInterval(timer);
        }

        function resetGame() {
            initGame();
            inputField.focus();
        }

        // بدء المؤقت
        function startTimer() {
            isPlaying = true;
            timer = setInterval(() => {
                timeLeft--;
                timeDisplay.innerHTML = `${timeLeft}<span class="text-sm font-normal mr-1" style="color: #8E8E93;">ث</span>`;
                
                // تحديث WPM الحي
                updateLiveStats();

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // تحديث الإحصائيات الحية
        function updateLiveStats() {
            const timeElapsed = 60 - timeLeft;
            if(timeElapsed > 0) {
                // WPM = (حروف صحيحة / 5) / الدقائق
                const minutes = timeElapsed / 60;
                const wpm = Math.round((correctKeystrokes / 5) / minutes);
                wpmDisplay.innerText = isNaN(wpm) ? 0 : wpm;
            }

            const totalTyped = correctWords + wrongWords;
            if(totalTyped > 0) {
                const accuracy = Math.round((correctWords / totalTyped) * 100);
                accuracyDisplay.innerText = `${accuracy}%`;
            }
        }

        // إنهاء اللعبة وعرض النتائج
        function endGame() {
            clearInterval(timer);
            isPlaying = false;
            inputField.disabled = true;
            
            const finalWPM = wpmDisplay.innerText;
            const finalAcc = accuracyDisplay.innerText;
            
            document.getElementById('final-wpm').innerText = finalWPM;
            document.getElementById('final-accuracy').innerText = finalAcc;
            document.getElementById('final-correct').innerText = correctWords;
            document.getElementById('final-wrong').innerText = wrongWords;
            
            modal.classList.remove('hidden');
        }

        function closeModalAndReset() {
            modal.classList.add('hidden');
            resetGame();
        }

        // مراقبة الإدخال
        inputField.addEventListener('input', (e) => {
            if (!isPlaying && timeLeft === 60 && inputField.value.trim().length > 0) {
                startTimer();
            }

            const currentWordElement = document.getElementById(`word-${currentWordIndex}`);
            const targetWord = wordsList[currentWordIndex];
            const typedValue = inputField.value;

            // إذا انتهى الوقت لا تفعل شيئاً
            if(timeLeft <= 0) return;

            // التحقق من المسافة (انتقال للكلمة التالية)
            if (typedValue.endsWith(' ')) {
                const typedWord = typedValue.trim();
                
                if (typedWord === targetWord) {
                    currentWordElement.classList.replace('current', 'correct');
                    correctWords++;
                    correctKeystrokes += targetWord.length + 1; // +1 للمسافة
                } else {
                    currentWordElement.classList.replace('current', 'incorrect');
                    wrongWords++;
                }

                currentWordIndex++;
                inputField.value = '';
                inputField.classList.remove('input-error');

                // تظليل الكلمة الجديدة وتحريك الشاشة إذا لزم الأمر
                const nextWordElement = document.getElementById(`word-${currentWordIndex}`);
                if (nextWordElement) {
                    nextWordElement.classList.add('current');
                    
                    // تمرير الشاشة التلقائي
                    const displayRect = displayArea.getBoundingClientRect();
                    const wordRect = nextWordElement.getBoundingClientRect();
                    if(wordRect.bottom > displayRect.bottom - 20) {
                        displayArea.scrollTop += 40; // تمرير لأسفل
                    }
                } else {
                    // إذا انتهت الكلمات (نادرة الحدوث في دقيقة) نولد المزيد
                    generateWords();
                    renderWords();
                    currentWordIndex = 0;
                    displayArea.scrollTop = 0;
                }
                
                updateLiveStats();
                return;
            }

            // التحقق الحي أثناء الكتابة (لتلوين مربع الإدخال بالأحمر عند الخطأ)
            if (targetWord.startsWith(typedValue)) {
                inputField.classList.remove('input-error');
            } else {
                inputField.classList.add('input-error');
            }
        });

    </script>
</body>
</html>
