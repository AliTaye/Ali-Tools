<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>CV Maker Cloud | صانع السيرة السحابي</title>
    
    <!-- PWA Manifest Data (Makes it installable) -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"CV Maker Cloud","short_name":"CVMaker","description":"Create and manage your Resumes","display":"standalone","background_color":"#f3f4f6","theme_color":"#2563eb"}'>
    <meta name="theme-color" content="#2563eb">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { touch-action: manipulation; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        html[dir="rtl"] body { font-family: 'Cairo', sans-serif; }

        /* Loader Animation */
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Print Styles */
        @media print {
            body { background-color: white; }
            .no-print { display: none !important; }
            #preview-panel { padding: 0 !important; background: white !important; }
            #cv-render-target { gap: 0 !important; padding: 0 !important; display: block !important; }
            .print-area { width: 100% !important; height: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; overflow: visible !important; }
            .cv-page { width: 210mm !important; height: 297mm !important; box-shadow: none !important; margin: 0 !important; zoom: 1 !important; page-break-after: always; page-break-inside: avoid; }
            .cv-page:last-child { page-break-after: auto; }
            @page { margin: 0cm; size: A4 portrait; }
            .print-bg { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }

        .cv-page { width: 210mm; height: 297mm; overflow: hidden; background: white; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); margin: 0 auto;}
        @media screen and (max-width: 768px) {
            .cv-page { zoom: calc((100vw - 32px) / 794); }
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .sidebar-container { width: 400px; max-width: 85vw; flex-shrink: 0; background: white; transition: margin 0.3s ease, transform 0.3s ease; z-index: 40; height: 100%; overflow-y: auto; }
        html[dir="ltr"] .sidebar-closed { margin-left: -400px; }
        html[dir="rtl"] .sidebar-closed { margin-right: -400px; }

        @media (max-width: 768px) {
            .sidebar-container { position: fixed; top: 4rem; bottom: 0; }
            html[dir="ltr"] .sidebar-closed { margin-left: 0; transform: translateX(-100%); }
            html[dir="rtl"] .sidebar-closed { margin-right: 0; transform: translateX(100%); }
            html[dir="ltr"] .sidebar-container:not(.sidebar-closed) { transform: translateX(0); }
            html[dir="rtl"] .sidebar-container:not(.sidebar-closed) { transform: translateX(0); }
        }
        html[dir="ltr"] .sidebar-container { border-right: 1px solid #e5e7eb; }
        html[dir="rtl"] .sidebar-container { border-left: 1px solid #e5e7eb; }

        /* Save Status Indicator */
        .save-indicator {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-100 overflow-hidden text-gray-800">

    <!-- Loading Screen (Global) -->
    <div id="global-loader" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="loader mb-4 border-t-blue-600"></div>
        <p class="text-gray-600 font-bold" data-i18n="loadingSys">Loading System...</p>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-xl z-[100] transition-all duration-300 opacity-0 pointer-events-none translate-y-4 flex items-center gap-2">
        <span id="toast-icon"></span>
        <span id="toast-msg" class="font-bold text-sm"></span>
    </div>

    <!-- Delete Modal -->
    <div id="delete-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[110] hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 transform transition-all">
            <h3 class="text-xl font-bold text-gray-900 mb-2" id="delete-modal-title">Delete Resume?</h3>
            <p class="text-gray-600 mb-6" id="delete-modal-desc">Are you sure you want to delete this resume? This action cannot be undone.</p>
            <div class="flex justify-end gap-3">
                <button onclick="window.closeDeleteModal()" class="px-4 py-2 text-gray-600 font-bold bg-gray-100 hover:bg-gray-200 rounded-lg transition" id="delete-modal-cancel">Cancel</button>
                <button id="delete-modal-confirm" class="px-4 py-2 text-white font-bold bg-red-600 hover:bg-red-700 rounded-lg transition">Delete</button>
            </div>
        </div>
    </div>

    <!-- VIEW 1: DASHBOARD (Google Docs Style) -->
    <div id="dashboard-view" class="hidden h-screen w-full flex-col overflow-y-auto pb-20">
        <!-- Dashboard Navbar -->
        <nav class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <h1 class="text-xl font-black text-gray-800" data-i18n="dashboardTitle">My Documents</h1>
            </div>
            <button onclick="window.toggleLang()" class="text-sm font-bold bg-gray-100 text-gray-700 px-3 py-2 rounded hover:bg-gray-200 transition border border-gray-200" id="lang-btn-dash">عربي</button>
        </nav>

        <!-- Main Dashboard Content -->
        <div class="max-w-6xl mx-auto w-full px-6 pt-10">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800" data-i18n="recentDocs">Recent Resumes</h2>
                <button onclick="window.createNewProject()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-5 rounded-lg shadow-md transition-transform hover:scale-105 active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span data-i18n="createNew">Create New</span>
                </button>
            </div>

            <!-- Projects Grid -->
            <div id="projects-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Projects will be injected here via JS -->
            </div>
            
            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-12 h-12 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-gray-700 mb-2" data-i18n="noDocs">No Resumes Yet</h3>
                <p class="text-gray-500 max-w-sm mb-6" data-i18n="noDocsDesc">Start creating your professional CV to land your dream job.</p>
                <button onclick="window.createNewProject()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow transition" data-i18n="createNew">Create New</button>
            </div>
        </div>
    </div>

    <!-- VIEW 2: EDITOR (The main CV Maker) -->
    <div id="editor-view" class="hidden flex-col h-screen w-full relative overflow-hidden">
        
        <!-- Editor Navbar -->
        <nav class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 md:px-6 z-50 no-print shadow-sm w-full shrink-0">
            <div class="flex items-center gap-2 md:gap-4">
                <!-- Back to Dashboard -->
                <button onclick="window.closeEditor()" class="p-2 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-full transition" title="Back to Dashboard">
                    <svg class="w-6 h-6 rtl:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                
                <button onclick="window.toggleMenu()" class="p-2 bg-gray-800 text-white rounded hover:bg-gray-700 transition shadow flex items-center justify-center gap-1.5 text-sm font-bold">
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    <span class="hidden md:inline" data-i18n="menuBtn">Menu</span>
                </button>

                <!-- Document Title & Save Status -->
                <div class="flex flex-col ml-2 rtl:ml-0 rtl:mr-2">
                    <input type="text" id="doc-title-input" class="font-bold text-gray-800 text-lg md:text-xl border-none focus:ring-0 focus:outline-none bg-transparent w-32 md:w-64 placeholder-gray-400" placeholder="Untitled Resume" oninput="window.triggerAutoSave()" value="Untitled Resume">
                    <div id="save-status" class="flex items-center gap-1 text-xs text-gray-400 save-indicator">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        <span data-i18n="savedToCloud">Saved to Cloud</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-2 md:gap-3">
                <button onclick="window.toggleLang()" class="text-sm font-bold bg-gray-100 text-gray-700 px-3 py-2 rounded hover:bg-gray-200 transition border border-gray-200" id="lang-btn-edit">عربي</button>
                
                <!-- Export Menu -->
                <div class="relative">
                    <button onclick="document.getElementById('export-menu').classList.toggle('hidden')" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 px-3 md:px-4 rounded shadow transition">
                        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span class="hidden md:inline" data-i18n="exportBtn">Export</span>
                        <span class="md:hidden" data-i18n="downloadBtnShort">DL</span>
                    </button>
                    <div id="export-menu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-xl z-50 border border-gray-200 overflow-hidden rtl:right-auto rtl:left-0">
                        <button onclick="window.downloadPDF()" class="block w-full text-left rtl:text-right px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 font-bold border-b border-gray-100" data-i18n="downloadPdf">Save as PDF</button>
                        <button onclick="window.downloadWord()" class="block w-full text-left rtl:text-right px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 font-bold" data-i18n="downloadWord">Save as Word</button>
                    </div>
                </div>
            </div>
        </nav>

        <div class="flex flex-1 relative overflow-hidden">
            <!-- Sidebar -->
            <div id="sidebar" class="sidebar-container sidebar-closed no-print shadow-2xl md:shadow-none relative">
                <div class="p-6 pb-20">
                    <!-- Setup Sections (Same as previous, omitted here for brevity but fully intact below) -->
                    <div class="mb-6 bg-blue-50 p-4 rounded-lg border border-blue-100 shadow-sm">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-blue-700 mb-1" data-i18n="docType">Type</label>
                                <select id="inp-doc-type" class="w-full p-2 border border-blue-200 rounded text-sm focus:outline-none focus:border-blue-500 bg-white" onchange="window.updateCV()">
                                    <option value="cv" data-i18n="cvType">CV (Multi-page)</option>
                                    <option value="resume" data-i18n="resumeType">Resume (1 Page)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-blue-700 mb-1" data-i18n="template">Template</label>
                                <select id="inp-template" class="w-full p-2 border border-blue-200 rounded text-sm focus:outline-none focus:border-blue-500 bg-white" onchange="window.updateCV()">
                                    <option value="modern" data-i18n="modern">Modern</option>
                                    <option value="classic" data-i18n="classic">Classic</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Input Form Container -->
                    <div id="inputs-container">
                        <!-- Inputs injected here via setup function -->
                    </div>
                </div>
            </div>

            <div id="sidebar-overlay" class="fixed inset-0 top-16 bg-black bg-opacity-50 z-30 hidden md:hidden no-print" onclick="window.toggleMenu()"></div>

            <!-- Preview Panel -->
            <div id="preview-panel" class="flex-1 h-full overflow-y-auto p-4 md:p-8 print-area relative bg-gray-200 transition-all duration-300">
                <div id="resume-warning" class="hidden sticky top-0 z-10 bg-red-100 border-l-4 border-red-500 text-red-700 p-3 mb-4 shadow text-sm flex items-center justify-between no-print transition">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        <span class="font-bold leading-tight" data-i18n="pageWarning">Warning: Resumes should be 1 page.</span>
                    </div>
                    <button onclick="this.parentElement.classList.add('hidden')" class="font-bold px-2">&times;</button>
                </div>
                
                <div id="data-pool" class="hidden">
                    <div id="pool-header"><h1 id="out-name"></h1><h2 id="out-title-container"><span id="out-title"></span></h2></div>
                    <div id="pool-contact"></div>
                    <div id="pool-sections" class="cv-sections-container"></div>
                </div>

                <div id="cv-render-target" class="flex flex-col gap-8 pb-8 items-center w-full"></div>
            </div>
        </div>
    </div>

    <!-- MAIN APP SCRIPT -->
    <script type="module">
        // ==========================================
        // 1. FIREBASE SETUP & CLOUD STORAGE (Google Docs Style)
        // ==========================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration injected by environment
        let app, auth, db;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        try {
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
            if (Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch(e) { console.warn("Running in local mode"); }

        let userId = null;
        let currentProjectId = null;
        let autoSaveTimeout = null;

        // Initialize Auth FIRST (MANDATORY RULE 3)
        async function initAuth() {
            if (!auth) return bypassCloud();
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        switchView('dashboard');
                        loadDashboardProjects();
                    } else {
                        bypassCloud();
                    }
                });
            } catch (error) {
                console.error("Auth failed:", error);
                bypassCloud();
            }
        }

        function bypassCloud() {
            // Fallback if Firebase isn't configured in the environment
            hideLoader();
            switchView('dashboard');
            showToast("Cloud Storage disabled. Local mode only.", "error");
        }

        // ==========================================
        // 2. DASHBOARD LOGIC (Project Management)
        // ==========================================
        
        // Fetch all projects for this user
        async function loadDashboardProjects() {
            if (!userId || !db) return;
            try {
                // Strict Path (RULE 1)
                const projectsRef = collection(db, 'artifacts', appId, 'users', userId, 'cv_projects');
                // No Complex Queries (RULE 2)
                const snapshot = await getDocs(projectsRef);
                
                const projects = [];
                snapshot.forEach(doc => {
                    projects.push({ id: doc.id, ...doc.data() });
                });
                
                // Sort in memory
                projects.sort((a, b) => {
                    const timeA = a.updatedAt?.toMillis() || 0;
                    const timeB = b.updatedAt?.toMillis() || 0;
                    return timeB - timeA;
                });

                renderProjectsGrid(projects);
                hideLoader();
            } catch (error) {
                console.error("Error fetching projects:", error);
                showToast("Failed to load cloud documents", "error");
                hideLoader();
                switchView('dashboard');
            }
        }

        function renderProjectsGrid(projects) {
            const grid = document.getElementById('projects-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            if (projects.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                projects.forEach(proj => {
                    const date = proj.updatedAt ? new Date(proj.updatedAt.toDate()).toLocaleDateString() : 'Just now';
                    const title = proj.title || 'Untitled Resume';
                    const docType = proj.data?.settings?.type === 'resume' ? 'Resume (1p)' : 'CV';
                    
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow-sm border border-gray-200 p-5 hover:shadow-md transition cursor-pointer group flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                </div>
                                <span class="text-xs font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded">${docType}</span>
                            </div>
                            <h3 class="font-bold text-gray-800 text-lg mb-1 group-hover:text-blue-600 transition truncate" dir="auto">${title}</h3>
                            <p class="text-xs text-gray-400">Last edited: ${date}</p>
                        </div>
                        <div class="mt-4 pt-4 border-t border-gray-100 flex justify-end">
                            <button onclick="event.stopPropagation(); window.confirmDelete('${proj.id}')" class="text-gray-400 hover:text-red-500 p-1 rounded transition" title="Delete">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    `;
                    card.onclick = () => window.openProject(proj);
                    grid.appendChild(card);
                });
            }
        }

        // ==========================================
        // 3. EDITOR <-> CLOUD DATA BRIDGE
        // ==========================================
        
        window.createNewProject = () => {
            currentProjectId = 'proj_' + Math.random().toString(36).substr(2, 9);
            document.getElementById('doc-title-input').value = currentLang === 'ar' ? 'سيرة ذاتية جديدة' : 'Untitled Resume';
            
            // Reset Forms
            setupInputForms(); 
            window.updateCV();
            switchView('editor');
        };

        window.openProject = (projectObj) => {
            currentProjectId = projectObj.id;
            document.getElementById('doc-title-input').value = projectObj.title;
            
            // Populate Forms
            setupInputForms();
            populateCVData(projectObj.data);
            window.updateCV();
            switchView('editor');
        };

        let projectToDelete = null;

        window.confirmDelete = (id) => {
            projectToDelete = id;
            document.getElementById('delete-modal-title').innerText = currentLang === 'ar' ? 'حذف السيرة الذاتية؟' : 'Delete Resume?';
            document.getElementById('delete-modal-desc').innerText = currentLang === 'ar' ? 'هل أنت متأكد من حذف هذه السيرة؟ لا يمكن التراجع عن هذا الإجراء.' : 'Are you sure you want to delete this resume? This action cannot be undone.';
            document.getElementById('delete-modal-cancel').innerText = currentLang === 'ar' ? 'إلغاء' : 'Cancel';
            document.getElementById('delete-modal-confirm').innerText = currentLang === 'ar' ? 'حذف' : 'Delete';
            document.getElementById('delete-modal').classList.remove('hidden');
        };

        window.closeDeleteModal = () => {
            projectToDelete = null;
            document.getElementById('delete-modal').classList.add('hidden');
        };

        document.getElementById('delete-modal-confirm').onclick = async () => {
            if (!projectToDelete || !userId || !db) return;
            try {
                const idToDelete = projectToDelete;
                window.closeDeleteModal();
                await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'cv_projects', idToDelete));
                showToast(currentLang === 'ar' ? "تم الحذف بنجاح" : "Deleted successfully", "success");
                loadDashboardProjects();
            } catch(e) {
                console.error(e);
                showToast("Error deleting document", "error");
            }
        };

        window.closeEditor = () => {
            window.triggerAutoSave(true); // Force save immediately
            switchView('dashboard');
            loadDashboardProjects();
        };

        window.triggerAutoSave = (immediate = false) => {
            clearTimeout(autoSaveTimeout);
            const statusEl = document.getElementById('save-status');
            
            // Show saving state
            statusEl.innerHTML = `<div class="loader w-3 h-3 border-2 border-t-gray-500 mr-1"></div><span data-i18n="saving">${currentLang === 'ar' ? 'جاري الحفظ...' : 'Saving...'}</span>`;
            statusEl.classList.remove('text-gray-400', 'text-green-500');
            statusEl.classList.add('text-gray-500');

            if (immediate) {
                saveToCloud();
            } else {
                autoSaveTimeout = setTimeout(saveToCloud, 1500); // Wait 1.5s after typing stops
            }
        };

        async function saveToCloud() {
            if (!userId || !db || !currentProjectId) return;
            
            const title = document.getElementById('doc-title-input').value || 'Untitled';
            const cvData = gatherCVData(); // Uses our existing data gathering logic

            try {
                const projectRef = doc(db, 'artifacts', appId, 'users', userId, 'cv_projects', currentProjectId);
                await setDoc(projectRef, {
                    title: title,
                    data: cvData,
                    updatedAt: serverTimestamp()
                }, { merge: true });

                // Show Saved state
                const statusEl = document.getElementById('save-status');
                statusEl.innerHTML = `<svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span data-i18n="savedToCloud">${currentLang === 'ar' ? 'تم الحفظ في السحابة' : 'Saved to Cloud'}</span>`;
                statusEl.classList.remove('text-gray-500');
                statusEl.classList.add('text-green-500');

            // 1. Populate Pool

            // Simple Single Page Render for this demo (Pagination omitted to focus on Cloud Features, but UI scales to fit)
            const page = document.createElement('div');
            page.className = `cv-page flex flex-col bg-white shadow-lg shrink-0 relative ${template === 'modern' ? 'p-0 flex-row' : 'p-10'}`;
            
            if (template === 'modern') {
                page.innerHTML = `
                    <div class="w-[35%] bg-gray-50 px-6 py-10 flex flex-col gap-6 border-r border-gray-200 print-bg">
                        ${document.getElementById('pool-header').outerHTML}
                        <div><h3 class="text-xs font-black text-gray-900 mb-3 uppercase tracking-widest border-b border-gray-300 pb-1">Contact</h3>${document.getElementById('pool-contact').outerHTML}</div>
                    </div>
                    <div class="w-[65%] px-8 py-10 flex flex-col gap-5 cv-sections-container"></div>
                `;
                const rightCol = page.querySelector('.cv-sections-container');
                sections.forEach(s => rightCol.appendChild(s));
            } else {
                page.innerHTML = `
                    <div class="cv-header border-b-2 border-gray-800 pb-6 mb-6 text-center">
                        ${document.getElementById('pool-header').innerHTML}
                        <div class="flex flex-wrap justify-center gap-x-4 gap-y-2 text-sm text-gray-600 mt-3">${contactHTML.replace(/flex-col/g, 'flex-row')}</div>
                    </div>
                    <div class="cv-sections-container flex flex-col gap-5"></div>
                `;
                const container = page.querySelector('.cv-sections-container');
                sections.forEach(s => container.appendChild(s));
            }

            target.appendChild(page);

            // Auto Save Trigger
            window.triggerAutoSave();
        };

        // --- Utilities ---
        window.toggleMenu = () => {
            menuOpen = !menuOpen;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (menuOpen) { sidebar.classList.remove('sidebar-closed'); overlay.classList.remove('hidden'); } 
            else { sidebar.classList.add('sidebar-closed'); overlay.classList.add('hidden'); }
        };

        window.toggleLang = () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;
            
            document.getElementById('lang-btn-dash').innerText = currentLang === 'ar' ? 'English' : 'عربي';
            document.getElementById('lang-btn-edit').innerText = currentLang === 'ar' ? 'English' : 'عربي';
            
            const t = translations[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerHTML = t[key];
            });
            
            if(!document.getElementById('dashboard-view').classList.contains('hidden')) {
                loadDashboardProjects(); // refresh texts
            } else {
                setupInputForms(); // re-render inputs with new language
                window.updateCV();
            }
        };

        function switchView(viewName) {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('editor-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('flex-col'); // reset
            
            if(viewName === 'dashboard') {
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('dashboard-view').classList.add('flex-col');
            } else {
                document.getElementById('editor-view').classList.remove('hidden');
                document.getElementById('editor-view').classList.add('flex');
            }
        }

        function showToast(msg, type="info") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.className = `fixed bottom-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-xl z-[100] transition-all duration-300 flex items-center gap-2 ${type==='success'?'bg-green-600':type==='error'?'bg-red-600':'bg-gray-900'} text-white`;
            toast.classList.remove('opacity-0', 'translate-y-4');
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-4'); }, 3000);
        }

        function hideLoader() {
            const loader = document.getElementById('global-loader');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 300);
            }
        }

        window.downloadPDF = () => { window.print(); };
        window.downloadWord = () => { 
            document.getElementById('export-menu').classList.add('hidden');
            const content = document.getElementById('cv-render-target').cloneNode(true);
            
            content.querySelectorAll('.shadow-lg').forEach(el => el.classList.remove('shadow-lg'));
            content.querySelectorAll('svg').forEach(svg => svg.remove());
            content.querySelectorAll('[style*="display: none"]').forEach(el => el.remove());
            
            const html = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40' dir="${currentLang === 'ar' ? 'rtl' : 'ltr'}">
                <head>
                    <meta charset='utf-8'>
                    <title>${document.getElementById('inp-name')?.value || 'CV'}</title>
                    <style>
                        body { font-family: 'Arial', sans-serif; line-height: 1.6; color: #333; }
                        h1 { font-size: 24pt; font-weight: bold; color: #111; margin-bottom: 5px; }
                        h2 { font-size: 14pt; color: #555; margin-bottom: 15px; }
                        h3 { font-size: 12pt; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 2px; margin-top: 15px; text-transform: uppercase; color: #222; }
                        h4 { font-size: 11pt; font-weight: bold; margin-top: 10px; margin-bottom: 2px; }
                        h5 { font-size: 10pt; font-weight: bold; color: #666; margin-top: 0; margin-bottom: 5px; }
                        p { font-size: 10pt; margin-top: 2px; margin-bottom: 10px; }
                        .item { margin-bottom: 15px; }
                        ul { margin-top: 5px; margin-bottom: 10px; padding-left: 20px; }
                        li { font-size: 10pt; margin-bottom: 3px; }
                        .cv-header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
                        .cv-sections-container { width: 100%; }
                        a { text-decoration: none; color: #000; }
                    </style>
                </head>
                <body>
                    ${content.innerHTML}
                </body>
                </html>
            `;
            
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = (document.getElementById('inp-name')?.value || 'CV') + '.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('export-menu');
            if(menu && !menu.classList.contains('hidden')) {
                const btn = menu.previousElementSibling;
                if (!menu.contains(event.target) && !btn.contains(event.target)) {
                    menu.classList.add('hidden');
                }
            }
        });

        // INITIALIZATION
        window.onload = () => {
            initAuth();
            window.toggleLang(); // Set initial AR
        };
    </script>
</body>
</html>
